  /api/v1/billing-registers/{id}/settlements:
    post:
      tags: [Billing Registers]
      summary: Include eligible freight settlement in billing register
      description: |
        Buyer-only. Server loads settlement by ID, validates eligibility and party match,
        derives line amounts from persisted settlement state. Idempotent when settlement
        is already linked to the same register.
      operationId: post_include_settlement_in_billing_register
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/XUserID'
        - $ref: '#/components/parameters/Authorization'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: company_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: actor
          in: query
          required: true
          schema: { type: string, enum: [BUYER] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settlement_id]
              properties:
                settlement_id: { type: string, format: uuid }
      security:
        - bearerAuth: []
      responses:
        '200': { description: Settlement included; returns register detail }
        '403': { description: Forbidden }
        '404': { description: Not found }
        '409': { description: Settlement already billed in another register }
        '422': { description: Settlement not eligible }
