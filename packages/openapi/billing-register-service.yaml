components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    XRequestID:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
      description: Correlation / request identifier
    XTenantID:
      name: X-Tenant-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Tenant context
    XCompanyID:
      name: X-Company-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Active company context
    XLocale:
      name: X-Locale
      in: header
      required: false
      schema:
        type: string
        example: ru-RU
    Authorization:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
      description: Bearer JWT access token
  schemas:
    CompatibilityReason:
      type: object
      required: [reason_code, dimension]
      properties:
        reason_code:
          type: string
        dimension:
          type: string
        rule_code:
          type: string
        rule_set_id:
          type: string
          format: uuid
        rule_set_scope:
          type: string
          enum: [SYSTEM, TENANT]
        rule_set_version:
          type: integer
        required_separation:
          type: string
          description: Structural separation condition. It is not a claim that legislation is satisfied.
        source_reference:
          type: string
    CompatibilityRuleSetRef:
      type: object
      required: [id, scope, version]
      description: Authoritative rule-set identity. Integer rule_set_versions are a legacy summary.
      properties:
        id:
          type: string
          format: uuid
        scope:
          type: string
          enum: [SYSTEM, TENANT]
        tenant_id:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
          minimum: 1
    CompatibilityCatalogVersionRef:
      type: object
      required: [id, catalog_kind, scope, version]
      description: Authoritative catalog version identity. Integer catalog_versions are a legacy system summary.
      properties:
        id:
          type: string
          format: uuid
        catalog_kind:
          type: string
        scope:
          type: string
          enum: [SYSTEM, TENANT]
        tenant_id:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
          minimum: 1
    NextLoadSearchRequest:
      type: object
      required: [capacity_id]
      additionalProperties: false
      properties:
        capacity_id: {type: string, format: uuid}
        candidate_limit: {type: integer, minimum: 0}
        policy:
          $ref: '#/components/schemas/NextLoadSearchPolicy'
    NextLoadSearchPolicy:
      type: object
      description: Request policy may tighten hard maxima. It cannot widen them. radius_km is the RADIUS prefilter and is not max_deadhead_km.
      properties:
        search_mode: {type: string, enum: [RADIUS, DIRECTIONAL_CORRIDOR, ROUTE_ELLIPSE]}
        target_location_id: {type: string, format: uuid}
        forward_search_km: {type: number, minimum: 0}
        corridor_deviation_km: {type: number, minimum: 0}
        max_deadhead_km: {type: number, minimum: 0}
        preferred_deadhead_km: {type: number, minimum: 0}
        max_deadhead_minutes: {type: number, minimum: 0}
        min_loaded_distance_km: {type: number, minimum: 0}
        max_route_increase_km: {type: number, minimum: 0}
        radius_km: {type: number, minimum: 0, nullable: true, description: Positive kilometres for RADIUS prefilter. Zero is rejected by the service.}
        objective_profile:
          type: string
          enum: [MIN_DEADHEAD, MAX_CAPACITY_UTILIZATION, RETURN_HOME, MAX_REVENUE, MIN_RISK, BALANCED, MAX_CONTRIBUTION]
          description: Executable system profile. MAX_CONTRIBUTION is reserved and returns OBJECTIVE_PROFILE_NOT_EXECUTABLE until a planning cost provider exists.
        ranking_currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Ordinary policy field. Required for MAX_REVENUE. No FX conversion is performed.
    NextLoadSearchResponse:
      type: object
      required: [search_id, capacity_id, capacity_version, search_mode, effective_policy, eligible_candidate_count, ranked_candidate_count, unranked_eligible_count, returned_candidate_count, rejection_counts_by_reason, unranked_counts_by_reason, ranking, candidates]
      properties:
        search_id: {type: string, format: uuid}
        capacity_id: {type: string, format: uuid}
        capacity_version: {type: integer}
        search_mode: {type: string}
        effective_policy: {$ref: '#/components/schemas/NextLoadSearchPolicy'}
        effective_policy_fingerprint: {type: string}
        eligible_candidate_count: {type: integer}
        ranked_candidate_count: {type: integer}
        unranked_eligible_count: {type: integer}
        returned_candidate_count: {type: integer}
        rejection_counts_by_reason:
          type: object
          additionalProperties: {type: integer}
          description: Hard-feasibility reject counts. Rejected load identities are not returned.
        unranked_counts_by_reason:
          type: object
          additionalProperties: {type: integer}
          description: Eligible candidates that could not be ranked. These are not hard rejects.
        ranking:
          $ref: '#/components/schemas/NextLoadSearchRanking'
        candidates:
          type: array
          items: {$ref: '#/components/schemas/NextLoadCandidate'}
    NextLoadCandidate:
      type: object
      required: [load_opportunity_id, eligibility, load, compatibility]
      properties:
        load_opportunity_id: {type: string, format: uuid}
        load_version: {type: integer}
        eligibility: {type: string, enum: [ELIGIBLE]}
        load: {$ref: '#/components/schemas/NetworkMarketplaceLoad'}
        deadhead_bucket: {type: string, enum: ["0-25", "25-50", "50-100", "100-200", "200+"]}
        road_deadhead_km: {type: number}
        road_deadhead_minutes: {type: number}
        forward_progress_km: {type: number, description: Corridor geometry. Not road distance. Omitted for anonymized loads.}
        lateral_distance_km: {type: number, description: Corridor geometry. Not road distance. Omitted for anonymized loads.}
        route_increase_km: {type: number}
        timing: {type: string}
        waiting_minutes: {type: number}
        compatibility: {type: string, enum: [COMPATIBLE, INCOMPATIBLE, INDETERMINATE]}
        explanation: {type: array, items: {type: string}}
        rank: {type: integer, minimum: 1, description: Present for RANKED candidates. Assigned before top-N truncation.}
        score_status: {type: string, enum: [RANKED, UNRANKED]}
        score: {type: integer, minimum: 0, maximum: 10000, description: Fixed-point match score. Omitted when unranked.}
        score_evidence_bps: {type: integer, minimum: 0, maximum: 10000}
        score_components:
          type: array
          items: {$ref: '#/components/schemas/NextLoadScoreComponent'}
        unranked_reason_codes: {type: array, items: {type: string}}
    NextLoadSearchRanking:
      type: object
      required: [objective_profile, profile_version, algorithm_version, profile_fingerprint]
      properties:
        objective_profile: {type: string}
        profile_version: {type: integer, minimum: 1}
        algorithm_version: {type: string}
        profile_fingerprint: {type: string}
        ranking_currency: {type: string, pattern: '^[A-Z]{3}$'}
    NextLoadScoreComponent:
      type: object
      required: [code, status, weight_bps, reason_code, explanation]
      properties:
        code: {type: string}
        status: {type: string, enum: [AVAILABLE, UNAVAILABLE, FALLBACK]}
        raw_value: {type: number, description: Omitted when it would reveal anonymized geography or a hidden commercial amount.}
        raw_unit: {type: string}
        normalized_points: {type: integer, minimum: 0, maximum: 10000}
        weight_bps: {type: integer, minimum: 1}
        weighted_points: {type: integer}
        reason_code: {type: string}
        explanation: {type: string}
    NetworkPlace:
      type: object
      description: Owner and non-anonymized place. Exact search geography. Address lines are not part of this snapshot.
      properties:
        location_id: {type: string, format: uuid}
        label: {type: string}
        latitude: {type: number}
        longitude: {type: number}
        country_code: {type: string, minLength: 2, maxLength: 2}
        region: {type: string}
        city: {type: string}
    NetworkCoarsePlace:
      type: object
      description: Anonymized display geography. Exact coordinates, location ids, and facility labels are absent.
      properties:
        country_code: {type: string, minLength: 2, maxLength: 2}
        region: {type: string}
        city: {type: string}
    NetworkLoadOpportunity:
      type: object
      additionalProperties: true
      properties:
        id: {type: string, format: uuid}
        pickup: {$ref: '#/components/schemas/NetworkPlace'}
        delivery: {$ref: '#/components/schemas/NetworkPlace'}
        consolidation_allowed:
          type: boolean
          description: Owner-controlled same-owner consolidation opt-in. Omitted on create means false. Not a search override.
        cross_shipper_consolidation_allowed:
          type: boolean
          description: Owner-controlled cross-shipper consolidation opt-in. Independent of consolidation_allowed. Not a search override.
    RoutePlanPublicLoadSnapshot:
      type: object
      additionalProperties: false
      required: [id, version, status, visibility_scope]
      description: Immutable evaluation-time load projection returned with a route plan. Foreign owner tenant id, commercial terms, source identifiers, invitations, and private rule text are omitted. Anonymized loads keep coarse geography only.
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        status: {type: string}
        visibility_scope: {type: string}
        pickup: {$ref: '#/components/schemas/NetworkPlace'}
        delivery: {$ref: '#/components/schemas/NetworkPlace'}
        pickup_window:
          type: object
          additionalProperties: false
          properties:
            start: {type: string, format: date-time}
            end: {type: string, format: date-time}
        delivery_window:
          type: object
          additionalProperties: false
          properties:
            start: {type: string, format: date-time}
            end: {type: string, format: date-time}
        weight_kg: {type: number}
        volume_m3: {type: number}
        body_type: {type: string}
        equipment:
          type: array
          items: {type: string}
        cargo:
          type: object
          additionalProperties: false
          description: Public cargo characteristics used for planning.
          properties:
            temperature_min_c: {type: number}
            temperature_max_c: {type: number}
            preferred_temperature_setpoint_c: {type: number}
            temperature_required: {type: boolean}
            required_body_types: {type: array, items: {type: string}}
            required_loading_access: {type: array, items: {type: string}}
            required_unloading_access: {type: array, items: {type: string}}
            allowed_loading_access: {type: array, items: {type: string}}
            allowed_unloading_access: {type: array, items: {type: string}}
            dangerous: {type: boolean}
            cargo_type_code: {type: string}
            pallet_count: {type: integer}
            pallet_type_code: {type: string}
            linear_meters: {type: number}
            max_loaded_height_mm: {type: integer}
            stackable: {type: boolean}
            fragile: {type: boolean}
            packaging_type_code: {type: string}
            food_grade_required: {type: boolean}
            odor_emission_class: {type: string}
            odor_sensitive: {type: boolean}
            contamination_class: {type: string}
            hazard_classes: {type: array, items: {type: string}}
    RoutePlanEvaluateRequest:
      type: object
      additionalProperties: false
      required: [planning_mode, candidate_load_ids]
      properties:
        planning_mode: {type: string, enum: [CURRENT_TRIP, DEPOT_START]}
        shipment_id: {type: string, format: uuid, description: Required for CURRENT_TRIP. Forbidden for DEPOT_START.}
        capacity_id: {type: string, format: uuid, description: Required for DEPOT_START. Forbidden for CURRENT_TRIP.}
        candidate_load_ids:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: {type: string, format: uuid}
    RoutePlanDecisionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer, minimum: 1, description: Plan version the caller read. The server compares stored dependencies and does not accept a caller-supplied match.}
    RoutePlanActivation:
      type: object
      required: [id, route_plan_id, plan_version, version, status, created_at]
      properties:
        id: {type: string, format: uuid}
        route_plan_id: {type: string, format: uuid}
        plan_version: {type: integer, minimum: 1}
        version: {type: integer, minimum: 1, description: Activation row version. Public activate starts at 1.}
        status: {type: string, enum: [PENDING_EXECUTION, EXECUTION_LINKED, REJECTED], description: Public activate persists PENDING_EXECUTION. EXECUTION_LINKED requires stored execution identifiers from a later projection.}
        execution_shipment_id: {type: string, format: uuid, nullable: true, description: Planning context shipment. Not TransportExecution.id.}
        execution_id: {type: string, format: uuid, nullable: true, description: TransportExecution id. Null while PENDING_EXECUTION.}
        execution_revision_id: {type: string, format: uuid, nullable: true, description: Execution revision id. Null while PENDING_EXECUTION.}
        created_at: {type: string, format: date-time}
    RoutePlanActivationResult:
      type: object
      required: [plan, activation]
      properties:
        plan: {$ref: '#/components/schemas/RoutePlan'}
        activation: {$ref: '#/components/schemas/RoutePlanActivation'}
    RoutePlanResultStatus:
      type: string
      enum: [FEASIBLE_PLAN_FOUND, INDETERMINATE_PLAN_FOUND]
    RoutePlanReasonCode:
      type: string
    RoutePoint:
      type: object
      description: Public route point. Exact location_id, latitude, and longitude are omitted when the stop contains only anonymized marketplace loads.
      required: [point_kind, point_source]
      properties:
        point_kind: {type: string, enum: [CANONICAL_LOCATION, POSITION_ANCHOR]}
        location_id: {type: string, format: uuid, nullable: true}
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        point_source: {type: string, enum: [CANONICAL_LOCATION, TRACKING_POSITION, CAPACITY_POSITION]}
        point_observed_at: {type: string, format: date-time}
        country_code: {type: string}
        region: {type: string}
        city: {type: string}
    RouteStopAction:
      type: object
      required: [id, action_ordinal, action_type, subject_type, subject_id, subject_version]
      properties:
        id: {type: string, format: uuid}
        action_ordinal: {type: integer, minimum: 1, maximum: 4}
        action_type: {type: string, enum: [PICKUP, DELIVERY]}
        subject_type: {type: string, enum: [LOAD_OPPORTUNITY, SHIPMENT_CARGO]}
        subject_id: {type: string, format: uuid}
        subject_version: {type: integer, minimum: 1}
        weight_delta_kg: {type: number}
        volume_delta_m3: {type: number}
        pallet_delta: {type: number}
        linear_meters_delta: {type: number}
        window_start: {type: string, format: date-time}
        window_end: {type: string, format: date-time}
        source_shipment_id: {type: string, format: uuid}
        source_shipment_version: {type: integer}
        evidence_state: {type: string}
        evidence_state_version: {type: integer}
        evidence_occurred_at: {type: string, format: date-time}
        public_subject_snapshot:
          $ref: '#/components/schemas/RoutePlanPublicLoadSnapshot'
    RouteStop:
      type: object
      required: [id, ordinal, stop_role, point_kind, point_source, actions]
      properties:
        id: {type: string, format: uuid}
        ordinal: {type: integer, minimum: 1, maximum: 8}
        stop_role: {type: string, enum: [START, CARGO, END]}
        point_kind: {type: string, enum: [CANONICAL_LOCATION, POSITION_ANCHOR]}
        location_id: {type: string, format: uuid, nullable: true, description: Omitted for a cargo stop whose actions are only anonymized marketplace loads.}
        latitude: {type: number, description: Omitted for a cargo stop whose actions are only anonymized marketplace loads.}
        longitude: {type: number, description: Omitted for a cargo stop whose actions are only anonymized marketplace loads.}
        country_code: {type: string}
        region: {type: string}
        city: {type: string}
        point_source: {type: string, enum: [CANONICAL_LOCATION, TRACKING_POSITION, CAPACITY_POSITION]}
        point_observed_at: {type: string, format: date-time}
        planned_arrival: {type: string, format: date-time}
        planned_departure: {type: string, format: date-time}
        service_duration_seconds: {type: integer}
        actions:
          type: array
          maxItems: 4
          items: {$ref: '#/components/schemas/RouteStopAction'}
    RouteLeg:
      type: object
      required: [id, ordinal, from_stop_id, to_stop_id, distance_m, duration_seconds, provider, route_mode, traffic_mode, provider_default_used]
      properties:
        id: {type: string, format: uuid}
        ordinal: {type: integer, minimum: 1}
        from_stop_id: {type: string, format: uuid}
        to_stop_id: {type: string, format: uuid}
        from_point_fingerprint: {type: string}
        to_point_fingerprint: {type: string}
        distance_m: {type: integer, minimum: 0}
        duration_seconds: {type: integer, minimum: 0}
        provider: {type: string}
        request_fingerprint: {type: string}
        response_fingerprint: {type: string}
        vehicle_profile_hash: {type: string}
        route_mode: {type: string}
        traffic_mode: {type: string}
        departure_bucket: {type: string}
        calculated_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        provider_default_used: {type: boolean}
    RouteCapacitySnapshot:
      type: object
      required: [id, sequence_ordinal, after_stop_id, after_action_ordinal, payload_status, volume_status, pallet_status, linear_status, height_status, temperature_allocation_status]
      properties:
        id: {type: string, format: uuid}
        sequence_ordinal: {type: integer, minimum: 0}
        after_stop_id: {type: string, format: uuid}
        after_action_ordinal: {type: integer, minimum: 0}
        payload_status: {type: string, enum: [KNOWN, UNKNOWN]}
        payload_remaining_kg: {type: number, nullable: true}
        volume_status: {type: string, enum: [KNOWN, UNKNOWN]}
        volume_remaining_m3: {type: number, nullable: true}
        pallet_status: {type: string, enum: [KNOWN, UNKNOWN]}
        pallet_positions_remaining: {type: number, nullable: true}
        linear_status: {type: string, enum: [KNOWN, UNKNOWN]}
        linear_meters_remaining: {type: number, nullable: true}
        height_status: {type: string, enum: [KNOWN, UNKNOWN]}
        height_remaining_mm: {type: number, nullable: true}
        temperature_allocation_status: {type: string}
        compatibility_status: {type: string, nullable: true}
        compatibility_fingerprint: {type: string, nullable: true}
        temperature_check_status: {type: string, nullable: true}
        adr_check_status: {type: string, nullable: true}
        food_grade_check_status: {type: string, nullable: true}
    RoutePlanDependency:
      type: object
      required: [id, dependency_kind]
      properties:
        id: {type: string, format: uuid}
        dependency_kind: {type: string, enum: [SHIPMENT, CAPACITY, VEHICLE, LOAD_OPPORTUNITY, SHIPMENT_CARGO, CURRENT_TRIP_CONTEXT, ROUTING_POLICY, CATALOG, RULE_SET, ALGORITHM_POLICY]}
        subject_id: {type: string, format: uuid, nullable: true}
        subject_version: {type: integer, nullable: true}
        fingerprint: {type: string}
    RoutePlan:
      type: object
      required: [id, version, status, planning_mode, result_status, execution_supported, context_fingerprint, evaluation_fingerprint, algorithm_policy_version, routing_policy_version, created_at, stops, legs, capacity_snapshots, dependencies, reason_codes]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        status: {type: string, enum: [EVALUATED, ACCEPTED, SUPERSEDED, CANCELLED]}
        planning_mode: {type: string, enum: [CURRENT_TRIP, DEPOT_START]}
        result_status: {$ref: '#/components/schemas/RoutePlanResultStatus'}
        execution_supported: {type: boolean, enum: [false]}
        capacity_id: {type: string, format: uuid, nullable: true}
        capacity_version: {type: integer, nullable: true}
        shipment_id: {type: string, format: uuid, nullable: true}
        shipment_version: {type: integer, nullable: true}
        vehicle_id: {type: string, format: uuid, nullable: true}
        context_fingerprint: {type: string}
        evaluation_fingerprint: {type: string}
        algorithm_policy_version: {type: string}
        routing_policy_version: {type: string}
        created_at: {type: string, format: date-time}
