    ConsolidationSearchRequest:
      type: object
      required: [pattern]
      additionalProperties: false
      properties:
        capacity_id: {type: string, format: uuid}
        shipment_id:
          type: string
          format: uuid
          description: Required for CURRENT_TRIP_FILL. The server builds the trip context. Residual facts are not accepted.
        pattern:
          type: string
          enum: [SAME_ORIGIN_SAME_DESTINATION, SAME_ORIGIN_SAME_DESTINATION_N_MEMBER, CURRENT_TRIP_FILL]
          description: SAME_ORIGIN_SAME_DESTINATION requires capacity_id and stays pairwise. SAME_ORIGIN_SAME_DESTINATION_N_MEMBER requires capacity_id and is the bounded 2-or-3 member search. CURRENT_TRIP_FILL requires shipment_id and plans exactly one additional load.
        policy:
          type: string
          enum: [REHANDLING_FORBIDDEN, REHANDLING_ALLOWED]
          description: Omitted means REHANDLING_FORBIDDEN. Not a residual, onboard, pool, or budget override.
        candidate_limit:
          type: integer
          minimum: 0
          description: Response cap applied after evaluation. It does not change pair generation, N-member set generation, server work budgets, counts, or persistence.
    ConsolidationSearchResponseBase:
      type: object
      required: [search_id, pattern, pool_load_count, evaluated_pair_count, feasible_candidate_count, indeterminate_candidate_count, hard_reject_candidate_count, returned_candidate_count, excluded_counts_by_reason, hard_reject_counts_by_reason, indeterminate_counts_by_reason, candidates]
      properties:
        search_id: {type: string, format: uuid}
        pattern: {type: string}
        pool_load_count: {type: integer}
        evaluated_pair_count: {type: integer}
        feasible_candidate_count: {type: integer}
        indeterminate_candidate_count: {type: integer}
        hard_reject_candidate_count: {type: integer}
        returned_candidate_count: {type: integer}
        excluded_counts_by_reason:
          type: object
          additionalProperties: {type: integer}
        hard_reject_counts_by_reason:
          type: object
          additionalProperties: {type: integer}
        indeterminate_counts_by_reason:
          type: object
          additionalProperties: {type: integer}
        candidates:
          type: array
          items: {$ref: '#/components/schemas/ConsolidationCandidate'}
    PairwiseConsolidationSearchResponse:
      allOf:
        - $ref: '#/components/schemas/ConsolidationSearchResponseBase'
        - type: object
          required: [capacity_id, capacity_version, pattern]
          properties:
            pattern: {type: string, enum: [SAME_ORIGIN_SAME_DESTINATION]}
            capacity_id: {type: string, format: uuid}
            capacity_version: {type: integer, minimum: 1}
            candidates:
              type: array
