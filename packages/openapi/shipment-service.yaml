          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/vehicles/{id}:
    get:
      tags: [Vehicles]
      summary: Get vehicle by ID
      description: Returns vehicle details for the authenticated tenant. Foreign-tenant vehicles are indistinguishable from missing vehicles (404). Tenant is derived from bearer authentication at the gateway; `tenant_id` is not a query parameter on this endpoint.
      operationId: get_get_vehicle_by_id
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/XCompanyID'
        - $ref: '#/components/parameters/XLocale'
        - $ref: '#/components/parameters/Authorization'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/order-execution/transport-orders/{id}/execute:
    post:
      tags: [Order Execution]
      summary: Execute awarded transport order (create shipment)
      operationId: post_execute_transport_order
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/XCompanyID'
        - $ref: '#/components/parameters/Authorization'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: carrier_company_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipment_number]
              properties:
                shipment_number: { type: string }
                planned_pickup_at: { type: string, format: date-time }
                planned_delivery_at: { type: string, format: date-time }
      security:
        - bearerAuth: []
      responses:
        '201': { description: Shipment created }
        '200': { description: Existing shipment returned (idempotent) }
        '403': { description: Forbidden }

  /api/v1/order-execution/transport-orders/{id}:
    get:
      tags: [Order Execution]
      summary: Get transport order execution view
      operationId: get_transport_order_execution
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/Authorization'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: company_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: actor
          in: query
          required: true
          schema: { type: string, enum: [BUYER, CARRIER] }
      security:
        - bearerAuth: []
      responses:
        '200': { description: Execution view }

  /api/v1/order-execution/transport-orders/{id}/start:
    post:
      tags: [Order Execution]
      summary: Start shipment execution after assignments
      operationId: post_start_transport_order_execution
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/Authorization'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: carrier_company_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      security:
        - bearerAuth: []
      responses:
        '200': { description: Execution started }

  /api/v1/carrier/transport-orders:
    get:
      tags: [Order Execution]
      summary: List carrier awarded transport orders
      operationId: get_carrier_transport_orders
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/Authorization'
        - name: carrier_company_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      security:
        - bearerAuth: []
      responses:
        '200': { description: Carrier order list }

  /api/v1/order-execution/buyer/transport-orders:
    get:
      tags: [Order Execution]
      summary: List buyer awarded transport orders
      operationId: get_buyer_transport_orders
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/Authorization'
        - name: buyer_company_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 0 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
      security:
        - bearerAuth: []
      responses:
        '200': { description: Buyer order list }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    XRequestID:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
      description: Correlation / request identifier
    XTenantID:
      name: X-Tenant-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Internal trusted tenant context set by API Gateway after JWT validation. Not a client-selectable parameter on shipment mutations.
    XCompanyID:
      name: X-Company-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Active company context
    XLocale:
      name: X-Locale
      in: header
      required: false
      schema:
        type: string
        example: ru-RU
    Authorization:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
      description: Bearer JWT access token
  schemas:
    CreateDriverRequest:
      type: object
      required: [carrier_company_id, full_name]
      additionalProperties: false
      properties:
        carrier_company_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        full_name:
          type: string
        phone:
          type: string
        license_number:
          type: string
        license_country:
          type: string
        preferred_locale:
          type: string
    CreateVehicleRequest:
      type: object
      required: [carrier_company_id, plate_number]
      additionalProperties: false
      properties:
        carrier_company_id:
          type: string
          format: uuid
        plate_number:
          type: string
        vehicle_type:
          type: string
        equipment_type:
          type: string
        capacity_weight:
          type: number
        capacity_volume:
          type: number
        registration_country:
          type: string
    CreateShipmentFromTransportOrderRequest:
      type: object
      required: [shipment_number, transport_order_id, carrier_company_id]
      additionalProperties: false
      description: Tenant scope and actor identity are derived from authenticated gateway context and cannot be selected through request body or query parameters.
      properties:
        shipment_number:
          type: string
        transport_order_id:
          type: string
          format: uuid
        carrier_company_id:
          type: string
          format: uuid
        forwarder_company_id:
          type: string
          format: uuid
          nullable: true
        planned_pickup_at:
          type: string
          format: date-time
        planned_delivery_at:
          type: string
          format: date-time
    CreateShipmentFromBidRequest:
      type: object
      required: [shipment_number, bid_id, transport_order_id]
      additionalProperties: false
      description: Tenant scope and actor identity are derived from authenticated gateway context and cannot be selected through request body or query parameters.
      properties:
        shipment_number:
          type: string
        bid_id:
          type: string
          format: uuid
        transport_order_id:
          type: string
          format: uuid
        planned_pickup_at:
          type: string
          format: date-time
        planned_delivery_at:
          type: string
          format: date-time
    UpdateShipmentStatusRequest:
      type: object
      required: [status]
      additionalProperties: false
      description: Tenant scope and actor identity are derived from authenticated gateway context and cannot be selected through request body or query parameters.
      properties:
        status:
          type: string
        actual_time:
          type: string
          format: date-time
    CancelShipmentRequest:
      type: object
      required: [reason]
      additionalProperties: false
      description: Tenant scope and actor identity are derived from authenticated gateway context and cannot be selected through request body or query parameters.
      properties:
        reason:
          type: string
    AssignDriverRequest:
      type: object
      required: [driver_id]
      additionalProperties: false
      properties:
        driver_id:
          type: string
          format: uuid
    AssignVehicleRequest:
      type: object
      required: [vehicle_id]
      additionalProperties: false
      properties:
        vehicle_id:
          type: string
          format: uuid
    ShipmentStatusSummaryResponse:
      type: object
      required: [totalShipments, countedShipments, byStatus, complete, calculatedAt]
      properties:
        totalShipments:
          type: integer
          format: int64
          description: Total non-deleted shipments for the tenant.
        countedShipments:
          type: integer
          format: int64
          description: Sum of counts in byStatus included in this response.
        byStatus:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Shipment count per status code.
        complete:
          type: boolean
          description: |
            True when the aggregate is safe for exact shadow comparison
            (totalShipments equals countedShipments and all rows are valid).
        calculatedAt:
          type: string
          format: date-time
          description: Aggregate calculation timestamp (UTC).
        warnings:
          type: array
          items:
            type: string
            enum: [UNKNOWN_SHIPMENT_STATUS]
    ShipmentStatusHistoryItem:
      type: object
      required: [id, shipmentId, shipmentVersion, toStatus, source, actor, occurredAt, recordedAt]
      properties:
        id: { type: string, format: uuid }
        shipmentId: { type: string, format: uuid }
        shipmentVersion: { type: integer }
        fromStatus: { type: string }
        toStatus: { type: string }
        reasonCode: { type: string }
        source: { type: string }
        actor:
          type: object
          required: [type]
          description: |
            USER means a verified authenticated user (gateway-set X-User-ID from JWT sub).
            SYSTEM means an explicit server-side process; never inferred from missing user context on HTTP mutations.
            Actor id is not accepted in mutation request bodies.
          properties:
            type: { type: string, enum: [USER, SYSTEM] }
            id: { type: string, format: uuid, description: Present for USER; omitted for SYSTEM. }
        correlationId: { type: string }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
    ShipmentStatusHistoryResponse:
      type: object
      required: [shipment, complete, items, page, limit, total, hasNext, warnings]
      properties:
        shipment:
          type: object
          properties:
            id: { type: string, format: uuid }
            number: { type: string }
            currentStatus: { type: string }
        complete: { type: boolean, description: True when initial creation transition (fromStatus null) exists. }
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentStatusHistoryItem'
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        hasNext: { type: boolean }
        warnings:
          type: array
          items:
            type: string
            enum: [SHIPMENT_STATUS_HISTORY_PARTIAL]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - SERVICE_UNAVAILABLE
                - INTERNAL_ERROR
                - ROUTE_NOT_FOUND
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
    PaginatedResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

