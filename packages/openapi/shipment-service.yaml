  /internal/v1/shipments/status-summary:
    get:
      tags: [Shipments]
      summary: Tenant-scoped full shipment status aggregate (internal)
      description: |
        Internal-only endpoint for Control Tower legacy baseline and shadow comparison.
        Not exposed as a public browser route through API Gateway catch-all.
        Tenant scope is required via trusted `X-Tenant-ID` header only.
        Returns complete tenant-wide status counts when `complete=true`.
      operationId: get_internal_shipment_status_summary
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Status aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentStatusSummaryResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /internal/v1/shipments/{shipmentId}/status-history:
    get:
      tags: [Shipments]
      summary: List persisted shipment status history (internal)
      description: |
        Internal-only endpoint for BFF aggregation. Not exposed as a public browser route through API Gateway catch-all.
        Tenant scope is required via trusted `X-Tenant-ID` header only.
      operationId: get_internal_shipment_status_history
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XTenantID'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Status history page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentStatusHistoryResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Shipment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
