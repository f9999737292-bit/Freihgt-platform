openapi: 3.0.3
info:
  title: Freight Platform API - Shipment Service
  version: 0.1.0
  description: |
    OpenAPI specification for Shipment Service.
servers:
  - url: http://localhost:8080
    description: Local API Gateway
tags:
  - name: Gateway
  - name: Auth
  - name: Users
  - name: Roles
  - name: Companies
  - name: Memberships
  - name: Locations
  - name: Cargoes
  - name: Transport Orders
  - name: RFx
  - name: Freight Requests
  - name: Bids
  - name: Shipments
  - name: Drivers
  - name: Vehicles
  - name: Order Execution
  - name: Documents
  - name: Signing
  - name: Billing Registers
  - name: Closing Documents

paths:
  /api/v1/shipments/from-transport-order:
    post:
      tags: [Shipments]
      summary: Create shipment from transport order
      operationId: post_create_shipment_from_transport_order
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/XCompanyID'
        - $ref: '#/components/parameters/XLocale'
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentFromTransportOrderRequest'
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/shipments/from-bid:
    post:
      tags: [Shipments]
      summary: Create shipment from accepted bid
      operationId: post_create_shipment_from_accepted_bid
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/XCompanyID'
        - $ref: '#/components/parameters/XLocale'
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentFromBidRequest'
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
