      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/XCompanyID'
        - $ref: '#/components/parameters/XLocale'
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        required: false
        description: Optional empty body. If present, must not contain tenant or actor fields; unknown properties are rejected.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
