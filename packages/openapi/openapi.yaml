  /api/v1/control-tower/critical-events/{eventId}/acknowledge:
    post:
      tags: [Control Tower]
      summary: Acknowledge a critical Control Tower event
      description: |
        Records an idempotent acknowledgement for a currently active derived critical event.
        The request body must be empty; tenant and actor identity are derived from the verified
        JWT bearer token only (no client-supplied tenant_id, user_id, or acknowledged_by).
        The gateway validates that `eventId` matches a currently derived critical event for the
        authenticated tenant before persisting acknowledgement state in the read model.
        Repeating the request returns HTTP 200 with the original acknowledgement (first ack wins).
      operationId: post_control_tower_critical_event_acknowledge
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/XLocale'
        - $ref: '#/components/parameters/Authorization'
        - name: eventId
          in: path
          required: true
          description: |
            Opaque deterministic event identifier from `ControlTowerEvent.id` (32 lowercase hex characters).
          schema:
            type: string
            pattern: '^[0-9a-f]{32}$'
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              maxProperties: 0
              additionalProperties: false
      responses:
        '200':
          description: Acknowledgement recorded (or returned idempotently if already acknowledged)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlTowerEventAcknowledgement'
        '400':
          description: Invalid eventId format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — caller lacks Control Tower access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            Event not found for the authenticated tenant (unknown eventId, resolved/non-current
