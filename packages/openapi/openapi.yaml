      summary: Reconcile fully allocated payment
      operationId: post_reconcile_fully_allocated_payment
      description: |
        Reconciles a payment after canonical financial confirmation.
        Requires FULLY_ALLOCATED status with active allocations recomputed from the database.
        Exact equality is required between payment amount, stored allocated amount, and active allocation sum.
        Repeat reconciliation is idempotent. Ordinary post-reconcile mutations are forbidden.
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/XTenantID'
