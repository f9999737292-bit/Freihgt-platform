  /api/v1/control-tower/summary:
    get:
      tags: [Control Tower]
      summary: Control Tower aggregated summary
      description: |
        BFF endpoint that aggregates shipments, transport orders, companies, and documents
        for the Control Tower dashboard. Supports server-side filtering and pagination.
        Optional dependencies may return partial responses with machine-readable warning codes.
        Tenant context is derived from the verified JWT bearer token only.
      operationId: get_control_tower_summary
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/XLocale'
        - $ref: '#/components/parameters/Authorization'
        - name: q
          in: query
          schema:
            type: string
          description: Search by shipment number, transport order number, shipper or carrier name
        - name: status
          in: query
          schema:
            type: string
          description: Shipment status filter
        - name: sla_status
          in: query
          schema:
            $ref: '#/components/schemas/ControlTowerSLAStatus'
        - name: shipper_id
          in: query
          schema:
            type: string
            format: uuid
        - name: carrier_id
          in: query
          schema:
            type: string
            format: uuid
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: critical_only
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Control Tower summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlTowerSummaryResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Required shipment data source is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/shipments/{shipmentId}/events:
    get:
      tags: [Shipments]
      summary: Shipment event history timeline
      description: |
        BFF endpoint that aggregates shipment state, documents, billing registers, and SLA signals
        into a unified event timeline. Optional dependencies may return partial responses with
        machine-readable warning codes. Tenant context is derived from the verified JWT bearer token only.
        Derived events are explicitly marked with `derived: true`.
      operationId: get_shipment_events
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/XLocale'
        - $ref: '#/components/parameters/Authorization'
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/ShipmentEventCategory'
        - name: source
          in: query
          schema:
            $ref: '#/components/schemas/ShipmentEventSource'
        - name: severity
          in: query
          schema:
            $ref: '#/components/schemas/ShipmentEventSeverity'
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: derived
          in: query
          schema:
            type: boolean
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Shipment event timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentEventsResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Shipment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Required shipment data source is temporarily unavailable
          content:
            application/json:
              schema:
