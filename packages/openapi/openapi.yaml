            type: string
            format: uuid
        - name: company_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Active company context requested by the authenticated user. The gateway validates membership and derives trusted internal company/actor context.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment reconciled or idempotent success
