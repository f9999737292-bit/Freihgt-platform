  /api/v1/shipments/{shipmentId}/events:
    get:
      tags: [Shipments]
      summary: Shipment event history timeline
      description: |
        BFF endpoint that aggregates shipment state, documents, billing registers, and SLA signals
        into a unified event timeline. Optional dependencies may return partial responses with
        machine-readable warning codes. Tenant context is derived from the verified JWT bearer token only.
        Derived events are explicitly marked with `derived: true`.
      operationId: get_shipment_events
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/XLocale'
        - $ref: '#/components/parameters/Authorization'
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/ShipmentEventCategory'
        - name: source
          in: query
          schema:
            $ref: '#/components/schemas/ShipmentEventSource'
        - name: severity
          in: query
          schema:
            $ref: '#/components/schemas/ShipmentEventSeverity'
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: derived
          in: query
          schema:
            type: boolean
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Shipment event timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentEventsResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Shipment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Required shipment data source is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
