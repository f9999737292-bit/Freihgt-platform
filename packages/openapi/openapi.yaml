components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    XRequestID:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
      description: Correlation / request identifier
    XTenantID:
      name: X-Tenant-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Internal trusted tenant context set by API Gateway after JWT validation. Not a client-selectable parameter on shipment mutations.
    XCompanyID:
      name: X-Company-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Active company context
    XLocale:
      name: X-Locale
      in: header
      required: false
      schema:
        type: string
        example: ru-RU
    Authorization:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
      description: Bearer JWT access token
  schemas:
    CreateDriverRequest:
      type: object
      required: [carrier_company_id, full_name]
      additionalProperties: false
      properties:
        carrier_company_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        full_name:
          type: string
        phone:
          type: string
        license_number:
          type: string
        license_country:
          type: string
        preferred_locale:
          type: string
    CreateVehicleRequest:
      type: object
      required: [carrier_company_id, plate_number]
      additionalProperties: false
      properties:
        carrier_company_id:
          type: string
          format: uuid
        plate_number:
          type: string
        vehicle_type:
          type: string
        equipment_type:
          type: string
        capacity_weight:
          type: number
        capacity_volume:
          type: number
        registration_country:
          type: string
    CreateShipmentFromTransportOrderRequest:
      type: object
      required: [shipment_number, transport_order_id, carrier_company_id]
      additionalProperties: false
      description: Tenant scope and actor identity are derived from authenticated gateway context and cannot be selected through request body or query parameters.
      properties:
        shipment_number:
          type: string
        transport_order_id:
          type: string
          format: uuid
        carrier_company_id:
          type: string
          format: uuid
        forwarder_company_id:
          type: string
          format: uuid
          nullable: true
        planned_pickup_at:
          type: string
          format: date-time
        planned_delivery_at:
          type: string
          format: date-time
    CreateShipmentFromBidRequest:
      type: object
      required: [shipment_number, bid_id, transport_order_id]
      additionalProperties: false
      description: Tenant scope and actor identity are derived from authenticated gateway context and cannot be selected through request body or query parameters.
      properties:
        shipment_number:
          type: string
        bid_id:
          type: string
          format: uuid
        transport_order_id:
          type: string
          format: uuid
        planned_pickup_at:
          type: string
          format: date-time
        planned_delivery_at:
          type: string
          format: date-time
    UpdateShipmentStatusRequest:
      type: object
      required: [status]
      additionalProperties: false
      description: Tenant scope and actor identity are derived from authenticated gateway context and cannot be selected through request body or query parameters.
      properties:
        status:
          type: string
        actual_time:
          type: string
          format: date-time
    CancelShipmentRequest:
      type: object
      required: [reason]
      additionalProperties: false
      description: Tenant scope and actor identity are derived from authenticated gateway context and cannot be selected through request body or query parameters.
      properties:
        reason:
          type: string
    AssignDriverRequest:
      type: object
      required: [driver_id]
      additionalProperties: false
      properties:
        driver_id:
          type: string
          format: uuid
    AssignVehicleRequest:
      type: object
      required: [vehicle_id]
      additionalProperties: false
      properties:
        vehicle_id:
          type: string
          format: uuid
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - SERVICE_UNAVAILABLE
                - INTERNAL_ERROR
                - ROUTE_NOT_FOUND
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
    PaginatedResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    ControlTowerSLAStatus:
      type: string
      enum: [ON_TIME, AT_RISK, DELAYED, CRITICAL, UNKNOWN]
    ControlTowerEventSeverity:
      type: string
      enum: [INFO, WARNING, CRITICAL]
    ControlTowerEventType:
      type: string
      enum:
        - PICKUP_DELAY
        - DELIVERY_DELAY
        - STALE_UPDATES
        - MISSING_DOCUMENTS
        - SHIPMENT_CANCELLED
        - TECHNICAL_PROBLEM
        - UNKNOWN_CRITICAL_EVENT
    ControlTowerSummaryResponse:
      type: object
      required: [generatedAt, dataFreshness, kpi, shipments, criticalEvents, filters]
      properties:
        generatedAt:
          type: string
          format: date-time
        dataFreshness:
          type: object
          properties:
            shipmentsLoaded:
              type: boolean
            transportOrdersLoaded:
              type: boolean
            companiesLoaded:
              type: boolean
            documentsLoaded:
              type: boolean
            partial:
              type: boolean
            warnings:
              type: array
              items:
                type: string
                enum:
                  - TRANSPORT_ORDERS_UNAVAILABLE
                  - COMPANIES_UNAVAILABLE
                  - DOCUMENTS_UNAVAILABLE
                  - KPI_CALCULATED_FROM_LIMITED_DATASET
                  - FILTER_OPTIONS_INCOMPLETE
                  - CONTROL_TOWER_READ_MODEL_UNAVAILABLE
                  - CONTROL_TOWER_READ_MODEL_CONSUMER_NOT_RUNNING
                  - CONTROL_TOWER_READ_MODEL_PARTIAL
                  - CONTROL_TOWER_READ_MODEL_FALLBACK_USED
                  - CONTROL_TOWER_LEGACY_STATUS_SUMMARY_LIMITED
        kpi:
          type: object
          properties:
            active: { type: integer }
            onTime: { type: integer }
            atRisk: { type: integer }
            delayed: { type: integer }
            critical: { type: integer }
            awaitingDocuments: { type: integer }
            readyForBilling: { type: integer }
        shipments:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ControlTowerShipment'
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            hasNext: { type: boolean }
        criticalEvents:
          type: array
          items:
            $ref: '#/components/schemas/ControlTowerEvent'
        filters:
          type: object
          properties:
            statuses:
              type: array
              items:
                $ref: '#/components/schemas/ControlTowerFilterOption'
            shippers:
              type: array
              items:
                $ref: '#/components/schemas/ControlTowerFilterOption'
            carriers:
              type: array
              items:
                $ref: '#/components/schemas/ControlTowerFilterOption'
        statusSummary:
          $ref: '#/components/schemas/ControlTowerStatusSummary'
        statusSummaryFreshness:
          $ref: '#/components/schemas/ControlTowerStatusSummaryFreshness'
    ControlTowerStatusSummarySource:
      type: string
      enum: [LEGACY, READ_MODEL]
    ControlTowerStatusSummary:
      type: object
      properties:
        totalShipments:
          type: integer
          format: int64
          description: Total tenant shipment population for the summary scope.
        countedShipments:
          type: integer
          format: int64
          description: Number of shipments included in byStatus counts.
        byStatus:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: When limitedDataset is true, counts cover countedShipments rather than the full totalShipments population.
        incompleteProjections:
          type: integer
          format: int64
        source:
          $ref: '#/components/schemas/ControlTowerStatusSummarySource'
        limitedDataset:
          type: boolean
          description: True when byStatus was calculated from a limited fetched dataset.
    ControlTowerStatusSummaryFreshness:
      type: object
      properties:
        loaded:
          type: boolean
        fallbackUsed:
          type: boolean
        partial:
          type: boolean
        source:
          $ref: '#/components/schemas/ControlTowerStatusSummarySource'
        consumerRunning:
          type: boolean
        lastRecordReceivedAt:
          type: string
          format: date-time
        lastProjectionAppliedAt:
          type: string
          format: date-time
    ControlTowerFilterOption:
      type: object
      properties:
        value: { type: string }
        label: { type: string }
    ControlTowerShipment:
      type: object
      properties:
        id: { type: string }
        shipmentNumber: { type: string }
        transportOrderId: { type: string }
        transportOrderNumber: { type: string }
        shipperId: { type: string }
        shipperName: { type: string }
        carrierId: { type: string }
        carrierName: { type: string }
        originId: { type: string }
        originName: { type: string }
        destinationId: { type: string }
        destinationName: { type: string }
        plannedPickupAt: { type: string, format: date-time }
        actualPickupAt: { type: string, format: date-time }
        plannedDeliveryAt: { type: string, format: date-time }
        actualDeliveryAt: { type: string, format: date-time }
        status: { type: string }
        slaStatus:
          $ref: '#/components/schemas/ControlTowerSLAStatus'
        slaReason: { type: string }
        delayMinutes: { type: integer }
        lastEvent: { type: string }
        lastUpdatedAt: { type: string, format: date-time }
        documentsComplete: { type: boolean }
        readyForBilling: { type: boolean }
    ControlTowerEvent:
      type: object
      properties:
        id: { type: string }
        shipmentId: { type: string }
        shipmentNumber: { type: string }
        type:
          $ref: '#/components/schemas/ControlTowerEventType'
        severity:
          $ref: '#/components/schemas/ControlTowerEventSeverity'
        occurredAt:
          type: string
          format: date-time
        description: { type: string }
        source: { type: string }
    ShipmentEventCategory:
      type: string
      enum: [SHIPMENT, OPERATION, DOCUMENT, SLA, BILLING, TECHNICAL, GEOLOCATION, SYSTEM]
    ShipmentEventSource:
      type: string
      enum: [SHIPMENT_STATE, SHIPMENT_STATUS_HISTORY, SLA_CALCULATOR, DOCUMENT_STATE, BILLING_STATE]
      description: |
        BFF-generated timeline events from current entity state use *_STATE or SLA_CALCULATOR sources and are always derived=true.
        Persisted shipment status transitions use SHIPMENT_STATUS_HISTORY with derived=false and sourceEventId set to the history row ID.
    ShipmentEventSeverity:
      type: string
      enum: [INFO, WARNING, CRITICAL]
    ShipmentEventActor:
      type: object
      description: |
        USER indicates a verified authenticated user from persisted status history.
        SYSTEM indicates an explicit server-side transition; never inferred from missing user context on HTTP mutations.
      properties:
        type: { type: string, enum: [USER, SYSTEM] }
        id: { type: string, format: uuid, description: Present for USER canonical history events. }
        name: { type: string, description: Not populated from status history in v0.1. }
    ShipmentTimelineEvent:
      type: object
      required: [id, shipmentId, shipmentNumber, type, category, source, severity, titleCode, occurredAt, derived]
      properties:
        id: { type: string }
        shipmentId: { type: string }
        shipmentNumber: { type: string }
        type: { type: string }
        category:
          $ref: '#/components/schemas/ShipmentEventCategory'
        source:
          $ref: '#/components/schemas/ShipmentEventSource'
        severity:
          $ref: '#/components/schemas/ShipmentEventSeverity'
        titleCode: { type: string }
        descriptionCode: { type: string }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        actor:
          $ref: '#/components/schemas/ShipmentEventActor'
        metadata:
          type: object
          additionalProperties: true
        derived: { type: boolean }
        correlationId: { type: string }
        sourceEventId: { type: string }
    ShipmentEventsResponse:
      type: object
      required: [shipment, generatedAt, dataFreshness, timeline, filters]
      properties:
        shipment:
          type: object
          properties:
            id: { type: string }
            number: { type: string }
            status: { type: string }
        generatedAt: { type: string, format: date-time }
        dataFreshness:
          type: object
          properties:
            shipmentLoaded: { type: boolean }
            shipmentEventsLoaded: { type: boolean, description: True when persisted shipment status history was loaded; false only when the internal history source is unavailable. Empty history for a legacy shipment still sets this to true. }
            documentsLoaded: { type: boolean }
            billingLoaded: { type: boolean }
            technicalEventsLoaded: { type: boolean }
