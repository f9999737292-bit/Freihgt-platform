        label: {type: string}
        help_text: {type: string, nullable: true}
        required: {type: boolean}
        validation_rule_json: {type: object, additionalProperties: true}
        sort_order: {type: integer}
        expected_version: {type: integer}
    RfxDuplicateQuestionRequest:
      type: object
