  /api/v1/payments/{id}/reconcile:
    post:
      tags: [Payments]
      summary: Reconcile fully allocated payment
      operationId: post_reconcile_fully_allocated_payment
      description: |
        Reconciles a payment after canonical financial confirmation.
        Requires FULLY_ALLOCATED status with active allocations recomputed from the database.
        Exact equality is required between payment amount, stored allocated amount, and active allocation sum.
        Repeat reconciliation is idempotent. Ordinary post-reconcile mutations are forbidden.
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/XCompanyID'
        - $ref: '#/components/parameters/XLocale'
        - $ref: '#/components/parameters/Authorization'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: company_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Active company context requested by the authenticated user. The gateway validates membership and derives trusted internal company/actor context.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment reconciled or idempotent success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
