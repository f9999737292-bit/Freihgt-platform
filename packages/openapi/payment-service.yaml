      tags: [Payments]
      summary: Void payment
      operationId: post_void_payment
      description: |
        Voids a RECEIVED payment with zero active allocations.
        RECONCILED and partially or fully allocated payments cannot be voided.
        Repeat void is idempotent. Actor and tenant context are derived from verified request context.
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/XCompanyID'
        - $ref: '#/components/parameters/XLocale'
        - $ref: '#/components/parameters/Authorization'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: company_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Active company context requested by the authenticated user. The gateway validates membership and derives trusted internal company/actor context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidRequest'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment voided or idempotent success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    XRequestID:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
      description: Correlation / request identifier
    XTenantID:
      name: X-Tenant-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Tenant context
    XCompanyID:
      name: X-Company-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Active company context
    XLocale:
      name: X-Locale
      in: header
      required: false
      schema:
        type: string
        example: ru-RU
    Authorization:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
      description: Bearer JWT access token
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - SERVICE_UNAVAILABLE
                - INTERNAL_ERROR
                - ROUTE_NOT_FOUND
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    VoidRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 255
          description: Required human-readable void reason
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
    PaginatedResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    PaymentRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        payment_number:
          type: string
        payer_company_id:
          type: string
          format: uuid
        payee_company_id:
          type: string
          format: uuid
        amount:
          type: string
        currency_code:
          type: string
        payment_date:
          type: string
          format: date
        source:
          type: string
        status:
          type: string
          enum:
            - RECEIVED
            - PARTIALLY_ALLOCATED
            - FULLY_ALLOCATED
            - RECONCILED
            - VOIDED
        allocated_amount:
          type: string
        unallocated_amount:
          type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        reference:
          type: string
        external_reference:
          type: string
        external_id:
          type: string
        created_by:
          type: string
          format: uuid
        voided_at:
          type: string
          format: date-time
        voided_by:
          type: string
          format: uuid
        void_reason:
          type: string
        reconciled_at:
          type: string
          format: date-time
        reconciled_by:
          type: string
          format: uuid
    PaymentListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PaymentRecord'
    PaymentAllocationReadRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
        obligation_id:
          type: string
          format: uuid
        allocated_amount:
          type: string
        currency_code:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        voided_at:
          type: string
          format: date-time
        voided_by:
          type: string
          format: uuid
        void_reason:
          type: string
        obligation_number:
          type: string
        obligation_status:
          type: string
        obligation_source_type:
          type: string
        obligation_source_id:
          type: string
          format: uuid
        obligation_outstanding_amount:
          type: string
    PaymentAllocationListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PaymentAllocationReadRecord'
    PaymentAuditEventRecord:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
        event_type:
          type: string
        actor_user_id:
          type: string
        actor_company_id:
          type: string
        payload:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    PaymentAuditEventListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PaymentAuditEventRecord'
    PaymentObligationRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        obligation_number:
          type: string
        payer_company_id:
          type: string
          format: uuid
        payee_company_id:
          type: string
          format: uuid
        source_type:
          type: string
        source_id:
          type: string
          format: uuid
        currency_code:
          type: string
        original_amount:
          type: string
        paid_amount:
          type: string
        outstanding_amount:
          type: string
        status:
          type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        due_date:
          type: string
          format: date
    EligiblePaymentObligationListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PaymentObligationRecord'
