  /api/v1/payment-allocations/{id}/void:
    post:
      tags: [Payments]
      summary: Void payment allocation
      operationId: post_void_payment_allocation
      description: |
        Voids an active allocation and recomputes payment/obligation balances from remaining active allocations.
        Append-only reversal. PAID obligation reversal is forbidden. RECONCILED payment mutation is forbidden.
        Repeat void is idempotent. Actor and tenant context are derived from verified request context.
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/XCompanyID'
        - $ref: '#/components/parameters/XLocale'
        - $ref: '#/components/parameters/Authorization'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: company_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Active company context requested by the authenticated user. The gateway validates membership and derives trusted internal company/actor context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidRequest'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Allocation voided or idempotent success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
