openapi: 3.0.3
info:
  title: Freight Platform API - Payment Service
  version: 0.1.0
  description: |
    OpenAPI specification for Payment Service.
servers:
  - url: http://localhost:8080
    description: Local API Gateway
tags:
  - name: Gateway
  - name: Auth
  - name: Users
  - name: Roles
  - name: Companies
  - name: Memberships
  - name: Locations
  - name: Cargoes
  - name: Transport Orders
  - name: RFx
  - name: Freight Requests
  - name: Bids
  - name: Shipments
  - name: Drivers
  - name: Vehicles
  - name: Documents
  - name: Signing
  - name: Billing Registers
  - name: Closing Documents
  - name: Payment Obligations
  - name: Payments
paths:
  /api/v1/payment-obligations:
    get:
      tags: [Payment Obligations]
      summary: List payment obligations
      operationId: get_list_payment_obligations
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/XCompanyID'
        - $ref: '#/components/parameters/XLocale'
        - $ref: '#/components/parameters/Authorization'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/payment-obligations/{id}:
    get:
      tags: [Payment Obligations]
      summary: Get payment obligation by ID
      operationId: get_get_payment_obligation_by_id
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/XCompanyID'
        - $ref: '#/components/parameters/XLocale'
        - $ref: '#/components/parameters/Authorization'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
