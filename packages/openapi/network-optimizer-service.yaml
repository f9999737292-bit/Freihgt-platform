  /api/v1/network/shipments/{shipmentId}/predicted-capacity:
    post:
      tags: [Network Optimizer]
      summary: Generate predicted capacity
      operationId: post_generate_predicted_capacity
      description: |
        Owner predictive capacity. A generated prediction is PRIVATE and PREDICTED.
        It is not marketplace capacity and it does not search or rank next loads.
        Activation to AVAILABLE stays PRIVATE until a separate publication.
        Confidence is a versioned rule score, not a calibrated probability.
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/XCompanyID'
        - $ref: '#/components/parameters/XLocale'
        - $ref: '#/components/parameters/Authorization'
