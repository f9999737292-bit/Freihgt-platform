openapi: 3.0.3
info:
  title: Freight Platform API - Network Optimizer Service
  version: 0.1.0
  description: |
    OpenAPI specification for Network Optimizer Service.
servers:
  - url: http://localhost:8080
    description: Local API Gateway
tags:
  - name: Gateway
  - name: Auth
  - name: Users
  - name: Roles
  - name: Companies
  - name: Memberships
  - name: Locations
  - name: Cargoes
  - name: Transport Orders
  - name: RFx
  - name: Freight Requests
  - name: Bids
  - name: Shipments
  - name: Drivers
  - name: Vehicles
  - name: Documents
  - name: Signing
  - name: Billing Registers
  - name: Closing Documents
  - name: Payment Obligations
  - name: Payments
  - name: Transport Contracts
  - name: Rate Cards
  - name: Rate Simulation
  - name: Freight Costs
  - name: Network Optimizer
paths:
  /api/v1/network/load-opportunities:
    post:
      tags: [Network Optimizer]
      summary: Create a load opportunity
      operationId: post_create_a_load_opportunity
      description: |
        BINTRANS Network Optimizer foundation mutation.
        Tenant and user identity come from the verified gateway JWT. Client identity headers are not trusted.
        Idempotency-Key replays the original result and does not create a second publication or outbox event.
        Omitted physical attributes stay unknown. Zero is not a substitute for unknown.
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/XCompanyID'
        - $ref: '#/components/parameters/XLocale'
        - $ref: '#/components/parameters/Authorization'
        - name: Idempotency-Key
          in: header
          required: false
          description: Replays the original mutation result when the same key and body are retried.
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Network Optimizer]
      summary: List own load opportunities
      operationId: get_list_own_load_opportunities
      description: |
        Tenant-scoped list. Marketplace reads return the visibility projection, not source shipment or transport-order rows.
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/XCompanyID'
        - $ref: '#/components/parameters/XLocale'
        - $ref: '#/components/parameters/Authorization'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Page size. Non-positive values are normalized to the default.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
