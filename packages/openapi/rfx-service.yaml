openapi: 3.0.3
info:
  title: Freight Platform API - RFx Service
  version: 0.1.0
  description: |
    OpenAPI specification for RFx Service.
    Tenant scope is derived from trusted `X-Tenant-ID` injected by API Gateway after JWT validation.
    Do not send `tenant_id` as a query parameter; it is rejected with HTTP 403.
    `owner_company_id` and `shipper_company_id` may be supplied as selectors only; the server validates
    authenticated buyer company membership and rejects cross-company mutations within the same tenant.
    Lane creation on `/v1/rfx-lots/{lot_id}/lanes` requires buyer membership on the persisted RFx owner
    company resolved via lot → RFx hierarchy; cross-company and cross-tenant attempts return HTTP 404.
servers:
  - url: http://localhost:8080
    description: Local API Gateway
tags:
  - name: Gateway
  - name: Auth
  - name: Users
  - name: Roles
  - name: Companies
  - name: Memberships
  - name: Locations
  - name: Cargoes
  - name: Transport Orders
  - name: RFx
  - name: Freight Requests
  - name: Bids
  - name: Shipments
  - name: Drivers
  - name: Vehicles
  - name: Documents
  - name: Signing
  - name: Billing Registers
  - name: Closing Documents

