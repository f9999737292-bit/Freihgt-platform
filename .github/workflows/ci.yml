name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  repository-safety:
    name: repository-safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tracked env files
        run: |
          set -euo pipefail
          TRACKED_ENV="$(git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -vE '\.env\.example$' || true)"
          if [ -n "$TRACKED_ENV" ]; then
            echo "ERROR: tracked .env files found (excluding .env.example):"
            echo "$TRACKED_ENV"
            exit 1
          fi
          echo "OK: no tracked .env secrets (.env.example allowed)"

      - name: Git status
        run: git status --short

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenAPI validation dependencies
        run: pip install pyyaml

      - name: Install ripgrep for naming gate
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: OpenAPI check
        run: make openapi-check

      - name: Active BINTRANS naming gate
        run: make check-active-bintrans-naming

      - name: BINTRANS staging release tooling selfchecks
        run: make check-bintrans-staging-release-tooling

  backend-go-check:
    name: backend-go-check (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - packages/shared-go
          - services/api-gateway
          - services/billing-register-service
          - services/payment-service
          - services/freight-cost-service
          - services/contract-rate-service
          - services/company-service
          - services/control-tower-read-model-service
          - services/document-service
          - services/identity-service
          - services/localization-service
          - services/rfx-service
          - services/shipment-service
          - services/transport-order-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            packages/shared-go/go.sum
            services/**/go.sum

      - name: Go version
        run: go version

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test ./...

  rfx-deadline-worker-integration:
    name: rfx-deadline-worker-integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: rfx_test
          POSTGRES_PASSWORD: rfx_test
          POSTGRES_DB: freight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      TEST_DATABASE_URL: postgres://rfx_test:rfx_test@localhost:5432/freight_test?sslmode=disable
      REQUIRE_TEST_DATABASE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            packages/shared-go/go.sum
            services/rfx-service/go.sum

      - name: Run deadline worker integration tests
        working-directory: services/rfx-service
        run: go test -tags=integration ./internal/integration/deadlineworker/... -count=1 -v

