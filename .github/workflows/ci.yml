name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  repository-safety:
    name: repository-safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tracked env files
        run: |
          set -euo pipefail
          TRACKED_ENV="$(git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -vE '\.env\.example$' || true)"
          if [ -n "$TRACKED_ENV" ]; then
            echo "ERROR: tracked .env files found (excluding .env.example):"
            echo "$TRACKED_ENV"
            exit 1
          fi
          echo "OK: no tracked .env secrets (.env.example allowed)"

      - name: Git status
        run: git status --short

  backend-go-check:
    name: backend-go-check (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - packages/shared-go
          - services/api-gateway
          - services/billing-register-service
          - services/company-service
          - services/control-tower-read-model-service
          - services/document-service
          - services/identity-service
          - services/localization-service
          - services/rfx-service
          - services/shipment-service
          - services/transport-order-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            packages/shared-go/go.sum
            services/**/go.sum

      - name: Go version
        run: go version

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test ./...

  frontend-web-admin-build:
    name: frontend-web-admin-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web-admin
        run: npm run build

  scripts-check:
    name: scripts-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          set -euo pipefail
          SCRIPTS=(
            tests/integration/smoke-test.sh
            tests/integration/run-upd-400-repro.sh
            tests/integration/upd-400-repro.sh
            scripts/dev/seed_dev_admin.sh
          )
          MISSING=()
          for script in "${SCRIPTS[@]}"; do
            if [ ! -f "$script" ]; then
              MISSING+=("$script")
              continue
            fi
            echo "Checking $script"
            bash -n "$script"
          done
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "Missing scripts:"
            printf '  - %s\n' "${MISSING[@]}"
            exit 1
          fi
          echo "OK: all shell scripts present and syntax-valid"

  driver-mobile-check:
    name: driver-mobile-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/driver-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/driver-mobile/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Web build
        run: npm run build

      - name: Capacitor sync android
        run: npm run cap:sync:android

  driver-mobile-android-build:
    name: driver-mobile-android-build
    runs-on: ubuntu-latest
    needs: driver-mobile-check
    defaults:
      run:
        working-directory: apps/driver-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/driver-mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npm run cap:sync:android

      - name: Assemble debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

  driver-mobile-ios-build:
    name: driver-mobile-ios-build
    runs-on: macos-latest
    needs: driver-mobile-check
    defaults:
      run:
        working-directory: apps/driver-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/driver-mobile/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Add iOS platform if missing
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor iOS
        run: npm run cap:sync:ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      - name: Build iOS app for simulator
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
