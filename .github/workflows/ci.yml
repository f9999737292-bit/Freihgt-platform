  scripts-check:
    name: scripts-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          set -euo pipefail
          SCRIPTS=(
            tests/integration/smoke-test.sh
            tests/integration/run-upd-400-repro.sh
            tests/integration/upd-400-repro.sh
            scripts/dev/seed_dev_admin.sh
            scripts/test/system-test-design-check.sh
            scripts/test/system-test-preflight.sh
            scripts/test/staging-acceptance-pack.sh
            scripts/test/run-system-security-wave1.sh
            scripts/test/run-system-wave2-core-business-flow.sh
            scripts/test/system-test-data-reset.sh
            tests/system/golden/fp_e2e_golden_001.sh
          )
          MISSING=()
          for script in "${SCRIPTS[@]}"; do
            if [ ! -f "$script" ]; then
              MISSING+=("$script")
              continue
            fi
            echo "Checking $script"
            bash -n "$script"
          done
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "Missing scripts:"
            printf '  - %s\n' "${MISSING[@]}"
            exit 1
          fi
          echo "OK: all shell scripts present and syntax-valid"
