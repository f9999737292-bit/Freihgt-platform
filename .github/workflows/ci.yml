  frontend-web-admin-build:
    name: frontend-web-admin-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web-admin
        run: npm run build

  frontend-web-procurement-check:
    name: frontend-web-procurement-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web-procurement
        run: pnpm --filter @freight-platform/web-procurement typecheck

      - name: Test web-procurement
        run: pnpm --filter @freight-platform/web-procurement test

      - name: Build web-procurement
        run: pnpm --filter @freight-platform/web-procurement build

  scripts-check:
    name: scripts-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          set -euo pipefail
          SCRIPTS=(
            tests/integration/smoke-test.sh
            tests/integration/run-upd-400-repro.sh
            tests/integration/upd-400-repro.sh
            scripts/dev/seed_dev_admin.sh
          )
          MISSING=()
          for script in "${SCRIPTS[@]}"; do
            if [ ! -f "$script" ]; then
              MISSING+=("$script")
              continue
            fi
            echo "Checking $script"
            bash -n "$script"
          done
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "Missing scripts:"
            printf '  - %s\n' "${MISSING[@]}"
            exit 1
          fi
          echo "OK: all shell scripts present and syntax-valid"
