# BINTRANS dedicated Control Tower staging — private loopback web-admin frontend.
#
# Target VM: bintrans-control-tower-staging (161.104.57.152)
# Compose project: bintrans-ct-staging (same project; frontend-only overlay)
#
# Operator access (SSH local forwarding only — no public ingress):
#   ssh -i ~/.ssh/bintrans_selectel_staging \
#     -L 13000:127.0.0.1:13000 \
#     -L 18080:127.0.0.1:18080 \
#     root@161.104.57.152
#
# Browser:
#   http://127.0.0.1:13000/login
#
# Apply with digest-pinned image from protected env (never commit secrets):
#   --env-file /protected/bintrans/control-tower-observation/staging.env
#
# Example (R3.4B):
#   docker compose \
#     -f infrastructure/docker-compose/docker-compose.yml \
#     -f infrastructure/docker-compose/docker-compose.bintrans-ct-staging-web-admin.yml \
#     --env-file /protected/bintrans/control-tower-observation/staging.env \
#     -p bintrans-ct-staging \
#     up -d web-admin

services:
  web-admin:
    image: ${BINTRANS_WEB_ADMIN_IMAGE:-${BINTRANS_REGISTRY:-cr.selcloud.ru/bintrans-staging}/web-admin:${BINTRANS_IMAGE_TAG:-local}}
    pull_policy: always
    container_name: bintrans_ct_staging_web_admin
    restart: unless-stopped
    environment:
      HOST: 127.0.0.1
      PORT: ${WEB_ADMIN_HOST_PORT:-13000}
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:18080}
      NUXT_PUBLIC_APP_NAME: ${NUXT_PUBLIC_APP_NAME:-Bintrans Freight Platform Admin}
      NUXT_PUBLIC_DEFAULT_LOCALE: ${NUXT_PUBLIC_DEFAULT_LOCALE:-ru-RU}
      NUXT_PUBLIC_DEFAULT_TENANT_ID: ${NUXT_PUBLIC_DEFAULT_TENANT_ID:-}
      NUXT_PUBLIC_MOCK_AUTH: ${NUXT_PUBLIC_MOCK_AUTH:-false}
      BINTRANS_RELEASE_SHA: ${DEPLOYED_GIT_SHA:-}
      BINTRANS_COMPONENT: web-admin
    ports:
      - "127.0.0.1:${WEB_ADMIN_HOST_PORT:-13000}:${WEB_ADMIN_HOST_PORT:-13000}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${WEB_ADMIN_HOST_PORT:-13000}/login"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
