# BINTRANS CT staging — Freight Cost Intelligence v2.2 pilot extension.
#
# Apply ONLY on dedicated non-prod VM (161.104.57.152) AFTER schema >= 000064.
# Layer on top of:
#   - docker-compose.yml
#   - docker-compose.bintrans-ct-staging.yml
#   - docker-compose.staging-shadow.yml (optional)
#   - docker-compose.bintrans-ct-staging-images.yml
#   - docker-compose.freight-cost-pilot.yml
#   - this file
#
# Protected env must include digest-pinned BINTRANS_FREIGHT_COST_IMAGE and
# BINTRANS_WEB_PROCUREMENT_IMAGE when BINTRANS_INCLUDE_IMAGES=1.

x-bintrans-database-url: &bintrans_database_url
  postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

services:
  freight-cost-service:
    ports: !override
      - "127.0.0.1:${FREIGHT_COST_HOST_PORT:-8092}:8092"
    environment:
      DATABASE_URL: *bintrans_database_url
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      ENVIRONMENT: staging
      FREIGHT_COST_ANALYTICS_PROJECTION_ENABLED: ${FREIGHT_COST_ANALYTICS_PROJECTION_ENABLED:-false}
    image: ${BINTRANS_FREIGHT_COST_IMAGE:-${BINTRANS_REGISTRY}/freight-cost-service:${BINTRANS_IMAGE_TAG}}

  web-procurement:
    build:
      context: ../..
      dockerfile: apps/web-procurement/Dockerfile
      args:
        NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:18080}
        NUXT_PUBLIC_FREIGHT_COST_WORKSPACE_ENABLED: ${NUXT_PUBLIC_FREIGHT_COST_WORKSPACE_ENABLED:-false}
    image: ${BINTRANS_WEB_PROCUREMENT_IMAGE:-${BINTRANS_REGISTRY}/web-procurement:${BINTRANS_IMAGE_TAG}}
    container_name: freight_web_procurement
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:18080}
      NUXT_PUBLIC_FREIGHT_COST_WORKSPACE_ENABLED: ${NUXT_PUBLIC_FREIGHT_COST_WORKSPACE_ENABLED:-false}
      NUXT_PUBLIC_MOCK_AUTH: ${NUXT_PUBLIC_MOCK_AUTH:-false}
    ports: !override
      - "127.0.0.1:${WEB_PROCUREMENT_HOST_PORT:-3005}:3005"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - freight-platform-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-gateway:
    environment:
      FREIGHT_COST_SERVICE_URL: http://freight-cost-service:8092
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      freight-cost-service:
        condition: service_healthy

  prometheus:
    volumes:
      - ../monitoring/prometheus/prometheus.freight-cost-pilot.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/control_tower_shadow_recording_rules.yml:/etc/prometheus/control_tower_shadow_recording_rules.yml:ro
