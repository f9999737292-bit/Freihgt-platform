# BINTRANS dedicated Control Tower staging — network isolation override.
#
# Target VM: bintrans-control-tower-staging
# Compose project: bintrans-ct-staging
#
# Apply with protected env (never commit secrets):
#   --env-file /protected/bintrans/control-tower-observation/staging.env
#
# Foundation (postgres + redpanda only):
#   -f docker-compose.yml
#   -f docker-compose.bintrans-ct-staging.yml
#   --profile messaging
#
# Shadow runtime adds:
#   -f docker-compose.staging-shadow.yml
#   -f docker-compose.bintrans-ct-staging-images.yml  (when registry images ready)
#   --profile read-model [--profile observability]
#
# Requires Docker Compose v2.23+ for ports !override semantics.

x-bintrans-database-url: &bintrans_database_url
  postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

services:
  postgres:
    ports: !override []

  redpanda:
    ports: !override []

  identity-service:
    ports: !override []
    environment:
      DATABASE_URL: *bintrans_database_url
      JWT_SECRET: ${JWT_SECRET}

  company-service:
    ports: !override []
    environment:
      DATABASE_URL: *bintrans_database_url

  transport-order-service:
    ports: !override []
    environment:
      DATABASE_URL: *bintrans_database_url
      CONTRACT_RATE_SERVICE_URL: http://contract-rate-service:8091
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}

  rfx-service:
    ports: !override []
    environment:
      DATABASE_URL: *bintrans_database_url

  shipment-service:
    ports: !override []
    environment:
      DATABASE_URL: *bintrans_database_url

  document-service:
    ports: !override []
    environment:
      DATABASE_URL: *bintrans_database_url

  billing-register-service:
    ports: !override []
    environment:
      DATABASE_URL: *bintrans_database_url
      PAYMENT_SERVICE_URL: http://payment-service:8090

  payment-service:
    ports: !override []
    environment:
      DATABASE_URL: *bintrans_database_url
      BILLING_REGISTER_SERVICE_URL: http://billing-register-service:8087
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}

  contract-rate-service:
    build:
      context: ../..
      dockerfile: services/contract-rate-service/Dockerfile
    container_name: freight_contract_rate_service
    restart: unless-stopped
    ports: !override []
    environment:
      CONTRACT_RATE_SERVICE_PORT: 8091
      DATABASE_URL: *bintrans_database_url
      RFX_SERVICE_URL: http://rfx-service:8084
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - freight-platform-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  freight-cost-service:
    build:
      context: ../..
      dockerfile: services/freight-cost-service/Dockerfile
    container_name: freight_freight_cost_service
    restart: unless-stopped
    ports: !override []
    environment:
      FREIGHT_COST_SERVICE_PORT: 8092
      DATABASE_URL: *bintrans_database_url
      TRANSPORT_ORDER_SERVICE_URL: http://transport-order-service:8083
      BILLING_REGISTER_SERVICE_URL: http://billing-register-service:8087
      COMPANY_SERVICE_URL: http://company-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8090
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - freight-platform-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8092/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  low-code-service:
    ports: !override []
    environment:
      DATABASE_URL: *bintrans_database_url

  control-tower-read-model-service:
    ports: !override
      - "127.0.0.1:${CONTROL_TOWER_READ_MODEL_HOST_PORT:-8089}:8089"
    environment:
      CONTROL_TOWER_DATABASE_URL: *bintrans_database_url

  api-gateway:
    ports: !override
      - "127.0.0.1:${API_GATEWAY_HOST_PORT:-18080}:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      PAYMENT_SERVICE_URL: http://payment-service:8090
      CONTRACT_RATE_SERVICE_URL: http://contract-rate-service:8091
      FREIGHT_COST_SERVICE_URL: http://freight-cost-service:8092
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}

  prometheus:
    ports: !override
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    ports: !override
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"

  migrate:
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
